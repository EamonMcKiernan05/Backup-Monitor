<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backup Monitor</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242836;
    --border: #2d3148;
    --text: #e4e6f0;
    --text-dim: #8b8fa3;
    --success: #3dd68c;
    --success-bg: #3dd68c18;
    --warning: #f5c542;
    --warning-bg: #f5c54218;
    --error: #ef5350;
    --error-bg: #ef535018;
    --info: #5b9dff;
    --info-bg: #5b9dff18;
    --running: #5b9dff;
    --running-bg: #5b9dff18;
    --pending: #8b8fa3;
    --pending-bg: #8b8fa318;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 24px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .header .meta {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .refresh-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.15s;
  }

  .refresh-btn:hover { background: var(--border); }

  .summary-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }

  .summary-card .count { font-size: 1.75rem; font-weight: 700; }
  .summary-card .label {
    font-size: 0.8rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 4px;
  }

  .summary-card.success .count { color: var(--success); }
  .summary-card.failed .count { color: var(--error); }
  .summary-card.warning .count { color: var(--warning); }
  .summary-card.running .count { color: var(--running); }
  .summary-card.pending .count { color: var(--pending); }
  .summary-card.unknown .count { color: var(--text-dim); }

  .section-title {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  /* Host cards */
  .hosts-section { margin-bottom: 32px; }

  .host-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .host-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .host-header:hover { background: var(--surface2); }

  .host-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .host-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .host-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .host-dot.offline { background: var(--error); box-shadow: 0 0 6px var(--error); }

  .host-name { font-weight: 600; font-size: 1rem; }
  .host-host { font-size: 0.82rem; color: var(--text-dim); }
  .host-error { font-size: 0.78rem; color: var(--error); margin-top: 2px; }

  .host-badges {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .host-badge {
    font-size: 0.78rem;
    color: var(--text-dim);
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 4px;
  }

  .host-toggle {
    color: var(--text-dim);
    font-size: 1.2rem;
    transition: transform 0.2s;
    margin-left: 12px;
  }

  .host-toggle.open { transform: rotate(90deg); }

  .host-guests {
    border-top: 1px solid var(--border);
    display: none;
  }

  .host-guests.open { display: block; }

  .guest-section-title {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    padding: 10px 20px 6px;
  }

  .guest-row {
    display: grid;
    grid-template-columns: 40px 1fr 80px 140px 110px 100px;
    align-items: center;
    gap: 12px;
    padding: 8px 20px;
    font-size: 0.85rem;
    transition: background 0.1s;
  }

  .guest-row:hover { background: var(--surface2); }

  .guest-type {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-dim);
    text-align: center;
    background: var(--surface2);
    border-radius: 4px;
    padding: 2px 4px;
    width: fit-content;
  }

  .guest-name { font-weight: 500; }
  .guest-id { color: var(--text-dim); font-size: 0.78rem; }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .status-badge.success { background: var(--success-bg); color: var(--success); }
  .status-badge.failed { background: var(--error-bg); color: var(--error); }
  .status-badge.warning { background: var(--warning-bg); color: var(--warning); }
  .status-badge.running { background: var(--running-bg); color: var(--running); }
  .status-badge.pending { background: var(--pending-bg); color: var(--pending); }
  .status-badge.unknown { background: var(--surface2); color: var(--text-dim); }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .status-badge.success .status-dot { background: var(--success); }
  .status-badge.failed .status-dot { background: var(--error); }
  .status-badge.warning .status-dot { background: var(--warning); }
  .status-badge.running .status-dot { background: var(--running); animation: pulse 1.5s infinite; }
  .status-badge.pending .status-dot { background: var(--pending); }
  .status-badge.unknown .status-dot { background: var(--text-dim); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .guest-time { color: var(--text-dim); font-size: 0.82rem; }

  .guest-error {
    color: var(--error);
    font-size: 0.78rem;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* External backups (TrueNAS, etc) */
  .backup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .backup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    transition: border-color 0.2s;
  }

  .backup-card:hover { border-color: #444; }

  .backup-card.status-success { border-left: 3px solid var(--success); }
  .backup-card.status-failed { border-left: 3px solid var(--error); }
  .backup-card.status-warning { border-left: 3px solid var(--warning); }
  .backup-card.status-running { border-left: 3px solid var(--running); }
  .backup-card.status-pending { border-left: 3px solid var(--pending); }

  .backup-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .backup-name { font-weight: 600; font-size: 1rem; }
  .backup-source { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 12px; }

  .backup-type {
    font-size: 0.75rem;
    color: var(--text-dim);
    background: var(--surface2);
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .backup-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .detail { font-size: 0.82rem; }
  .detail .detail-label {
    color: var(--text-dim);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .detail .detail-value { font-weight: 500; margin-top: 2px; }

  .backup-issues {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .issue {
    font-size: 0.82rem;
    padding: 6px 10px;
    border-radius: 4px;
    margin-bottom: 4px;
  }

  .issue.error { background: var(--error-bg); color: var(--error); }
  .issue.warning { background: var(--warning-bg); color: var(--warning); }

  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  .loading .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--info);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .no-data {
    text-align: center;
    padding: 40px;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .guest-row-header {
    display: grid;
    grid-template-columns: 40px 1fr 80px 140px 110px 100px;
    align-items: center;
    gap: 12px;
    padding: 4px 20px 8px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }

  /* Uptime Monitor */
  .uptime-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }

  .uptime-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.2s;
  }

  .uptime-card:hover { border-color: #444; }

  .uptime-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .uptime-dot.up { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .uptime-dot.down { background: var(--error); box-shadow: 0 0 8px var(--error); }
  .uptime-dot.unknown { background: var(--text-dim); }

  .uptime-info { flex: 1; }
  .uptime-name { font-weight: 500; font-size: 0.9rem; }
  .uptime-ip { font-size: 0.8rem; color: var(--text-dim); }
  .uptime-latency { font-size: 0.75rem; color: var(--success); }
  .uptime-latency.down { color: var(--error); }

  @media (max-width: 768px) {
    .guest-row {
      grid-template-columns: 36px 1fr 70px 100px;
      gap: 8px;
    }
    .guest-row > :nth-child(5),
    .guest-row > :nth-child(6) { display: none; }
    .guest-row-header > :nth-child(5),
    .guest-row-header > :nth-child(6) { display: none; }
    .backup-grid { grid-template-columns: 1fr; }
    .summary-bar { grid-template-columns: repeat(3, 1fr); }
    .uptime-grid { grid-template-columns: 1fr 1fr; }
    body { padding: 16px; }
  }
</style>
</head>
<body>
  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <div>Loading backup data...</div>
    </div>
  </div>

<script>
const API_BASE = '';
const REFRESH_INTERVAL = 60000;

let dashboardData = null;
let refreshTimer = null;

async function fetchData() {
  try {
    const resp = await fetch(`${API_BASE}/api/dashboard`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    dashboardData = await resp.json();
    render();
  } catch (err) {
    renderError(err.message);
  }
}

function render() {
  if (!dashboardData) return;

  const { proxmox_nodes, servers, backups, health, updated_at } = dashboardData;
  const summary = computeSummary();
  const updatedTime = new Date(updated_at * 1000).toLocaleTimeString();

  let html = `
    <div class="header">
      <h1>Backup Monitor</h1>
      <div class="meta">
        <span>Updated: ${updatedTime}</span>
        <span>Refresh: ${REFRESH_INTERVAL / 1000}s</span>
        <button class="refresh-btn" onclick="fetchData()">↻ Refresh</button>
      </div>
    </div>
  `;

  // Summary cards
  html += `<div class="summary-bar">`;
  html += summaryCard(summary.total, 'Total', '');
  if (summary.success > 0) html += summaryCard(summary.success, 'Success', 'success');
  if (summary.running > 0) html += summaryCard(summary.running, 'Running', 'running');
  if (summary.warning > 0) html += summaryCard(summary.warning, 'Warning', 'warning');
  if (summary.failed > 0) html += summaryCard(summary.failed, 'Failed', 'failed');
  if (summary.pending > 0) html += summaryCard(summary.pending, 'Pending', 'pending');
  html += `</div>`;

  // Uptime Monitor
  if (health && health.length > 0) {
    const up = health.filter(h => h.status === 'up').length;
    const down = health.filter(h => h.status === 'down').length;
    html += `<div class="section-title">Uptime Monitor — ${up} up${down ? ', ' + down + ' down' : ''}</div>`;
    html += `<div class="uptime-grid">`;
    for (const host of health) {
      const dotClass = host.status === 'up' ? 'up' : host.status === 'down' ? 'down' : 'unknown';
      const latencyText = host.latency_ms !== null ? `${host.latency_ms.toFixed(1)}ms` : '';
      html += `
        <div class="uptime-card">
          <div class="uptime-dot ${dotClass}"></div>
          <div class="uptime-info">
            <div class="uptime-name">${esc(host.name)}</div>
            <div class="uptime-ip">${esc(host.ip)}</div>
            ${latencyText ? `<div class="uptime-latency ${dotClass}">${latencyText}</div>` : ''}
          </div>
        </div>
      `;
    }
    html += `</div>`;
  }

  // Proxmox hosts with VMs/LXCs
  if (proxmox_nodes && proxmox_nodes.length > 0) {
    html += `<div class="hosts-section">`;
    html += `<div class="section-title">Proxmox Cluster</div>`;
    for (const node of proxmox_nodes) {
      html += renderHostCard(node);
    }
    html += `</div>`;
  }

  // External server connections
  if (servers && servers.length > 0) {
    html += `<div class="section-title">External Servers</div>`;
    html += `<div class="server-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:24px;">`;
    for (const srv of servers) {
      const dotClass = srv.connected ? 'online' : 'offline';
      html += `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:12px;">
          <div class="host-dot ${dotClass}"></div>
          <div>
            <div style="font-weight:500;font-size:0.9rem;">${esc(srv.name)}</div>
            <div style="font-size:0.8rem;color:var(--text-dim);">${esc(srv.host)}</div>
            ${srv.connection_error ? `<div style="font-size:0.75rem;color:var(--error);margin-top:4px;">${esc(srv.connection_error)}</div>` : ''}
          </div>
        </div>
      `;
    }
    html += `</div>`;
  }

  // External backups (TrueNAS replication, snapshots, etc)
  if (backups && backups.length > 0) {
    html += `<div class="section-title">Replication & Snapshots</div>`;
    html += `<div class="backup-grid">`;
    for (const backup of backups) {
      html += renderBackupCard(backup);
    }
    html += `</div>`;
  }

  document.getElementById('app').innerHTML = html;
}

function computeSummary() {
  const summary = { total: 0 };
  if (!dashboardData) return summary;

  for (const b of (dashboardData.backups || [])) {
    summary.total++;
    summary[b.status] = (summary[b.status] || 0) + 1;
  }

  for (const node of (dashboardData.proxmox_nodes || [])) {
    for (const guest of { ...node.vm_status, ...node.lxc_status }.values()) {
      summary.total++;
      summary[guest.status] = (summary[guest.status] || 0) + 1;
    }
  }

  return summary;
}

function summaryCard(count, label, cls) {
  return `<div class="summary-card ${cls}"><div class="count">${count}</div><div class="label">${label}</div></div>`;
}

function renderHostCard(node) {
  const dotClass = node.connected ? 'online' : 'offline';
  const vmCount = Object.keys(node.vm_status || {}).length;
  const lxcCount = Object.keys(node.lxc_status || {}).length;
  const id = 'host-' + node.name.replace(/\s+/g, '-');

  let html = `
    <div class="host-card">
      <div class="host-header" onclick="toggleGuests('${id}')">
        <div class="host-left">
          <div class="host-dot ${dotClass}"></div>
          <div>
            <div class="host-name">${esc(node.name)}</div>
            <div class="host-host">${esc(node.host)}</div>
            ${node.connection_error ? `<div class="host-error">${esc(node.connection_error)}</div>` : ''}
          </div>
        </div>
        <div class="host-badges">
          ${vmCount > 0 ? `<span class="host-badge">${vmCount} VM</span>` : ''}
          ${lxcCount > 0 ? `<span class="host-badge">${lxcCount} LXC</span>` : ''}
          <span class="host-toggle" id="${id}-toggle">›</span>
        </div>
      </div>
      <div class="host-guests" id="${id}-guests">
  `;

  if (vmCount > 0) {
    html += `<div class="guest-section-title">Virtual Machines</div>`;
    html += renderGuestHeader();
    for (const [vmid, guest] of Object.entries(node.vm_status)) {
      html += renderGuestRow(guest, vmid);
    }
  }

  if (lxcCount > 0) {
    html += `<div class="guest-section-title">Containers</div>`;
    html += renderGuestHeader();
    for (const [vmid, guest] of Object.entries(node.lxc_status)) {
      html += renderGuestRow(guest, vmid);
    }
  }

  html += `</div></div>`;
  return html;
}

function renderGuestHeader() {
  return `<div class="guest-row-header">
    <span>Type</span><span>Name</span><span>Backup</span><span>Last Run</span><span>Duration</span><span>Error</span>
  </div>`;
}

function renderGuestRow(guest, vmid) {
  return `<div class="guest-row">
    <span class="guest-type">${esc(guest.vm_type)}</span>
    <span class="guest-name">${esc(guest.name)} <span class="guest-id">#${vmid}</span></span>
    <span><span class="status-badge ${guest.status}"><span class="status-dot"></span>${guest.status}</span></span>
    <span class="guest-time">${guest.time_since_last || '—'}</span>
    <span class="guest-time">${formatDuration(guest.last_duration)}</span>
    <span class="guest-error">${guest.error || ''}</span>
  </div>`;
}

function renderBackupCard(backup) {
  const statusClass = backup.status || 'unknown';
  let html = `
    <div class="backup-card status-${statusClass}">
      <div class="backup-header">
        <div>
          <div class="backup-name">${esc(backup.name)}</div>
          <div class="backup-source">${esc(backup.source)}</div>
        </div>
        <div>
          <span class="status-badge ${statusClass}"><span class="status-dot"></span>${statusClass}</span>
          <span class="backup-type">${esc(backup.backup_type)}</span>
        </div>
      </div>
  `;

  if (backup.status_message) {
    html += `<div style="font-size:0.85rem;color:var(--text-dim);margin-bottom:12px;">${esc(backup.status_message)}</div>`;
  }

  html += `<div class="backup-details">`;
  if (backup.time_since_last) html += detailRow('Last Run', backup.time_since_last);
  if (backup.time_until_next) html += detailRow('Next Run', backup.time_until_next);
  if (backup.last_duration) html += detailRow('Duration', formatDuration(backup.last_duration));
  if (backup.data_transferred_human) html += detailRow('Transferred', backup.data_transferred_human);
  if (backup.total_size_human) html += detailRow('Total Size', backup.total_size_human);
  if (backup.new_data_human) html += detailRow('New Data', backup.new_data_human);
  html += `</div>`;

  if (backup.errors && backup.errors.length > 0) {
    html += `<div class="backup-issues">`;
    for (const err of backup.errors) {
      html += `<div class="issue error">✕ ${esc(err)}</div>`;
    }
    html += `</div>`;
  }

  if (backup.warnings && backup.warnings.length > 0) {
    html += `<div class="backup-issues">`;
    for (const warn of backup.warnings) {
      html += `<div class="issue warning">⚠ ${esc(warn)}</div>`;
    }
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function detailRow(label, value) {
  return `<div class="detail"><div class="detail-label">${label}</div><div class="detail-value">${value}</div></div>`;
}

function formatDuration(seconds) {
  if (!seconds || seconds === 0) return '—';
  if (seconds < 60) return `${seconds}s`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
  return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
}

function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function toggleGuests(id) {
  const el = document.getElementById(id + '-guests');
  const toggle = document.getElementById(id + '-toggle');
  if (el.classList.contains('open')) {
    el.classList.remove('open');
    toggle.classList.remove('open');
  } else {
    el.classList.add('open');
    toggle.classList.add('open');
  }
}

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="no-data">
      <div style="color:var(--error);margin-bottom:12px;">Failed to load dashboard</div>
      <div style="font-size:0.85rem;color:var(--text-dim);">${esc(msg)}</div>
    </div>
  `;
}

// Start
fetchData();
setInterval(fetchData, REFRESH_INTERVAL);
</script>
</body>
</html>
