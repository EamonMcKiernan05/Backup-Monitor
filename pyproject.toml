[project]
name = "backup-monitor"
version = "0.1.0"
description = "Homelab backup monitoring dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
backup-monitor = "main:main"

[tool.hatch.build]
include = ["src/**", "main.py"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
