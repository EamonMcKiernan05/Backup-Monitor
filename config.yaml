# Backup Monitor Configuration

dashboard:
  title: "Homelab Backup Dashboard"
  refresh_interval: 60

proxmox:
  nodes:
    - host: proxmox-1
      name: "proxmox-1"
      ip: ${PROXMOX_NODE_1|192.168.1.7}
    - host: proxmox-2
      name: "proxmox-2"
      ip: ${PROXMOX_NODE_2|192.168.1.8}
    - host: proxmox-3
      name: "proxmox-3"
      ip: ${PROXMOX_NODE_3|192.168.1.9}
  entry_point: ${PROXMOX_ENTRY|192.168.1.7}
  user: ${PROXMOX_USER|root@pam}
  api_port: 8006
  verify_ssl: false

truenas:
  servers:
    - host: truenas-main
      name: "TrueNAS Main"
      ip: ${TRUENAS_MAIN_HOST|192.168.1.12}
      user: ${TRUENAS_MAIN_USER|admin}
  api_port: 443
  verify_ssl: false

# Uptime monitoring — hosts listed here get pinged in addition to proxmox/truenas
health:
  hosts:
    - name: "Junior Agent"
      ip: "192.168.1.6"
    - name: "TrueNAS Backup"
      ip: "192.168.1.108"
