# Backup Monitor Configuration

dashboard:
  title: "Homelab Backup Dashboard"
  refresh_interval: 60

proxmox:
  nodes:
    - host: ${PROXMOX_NODE_1|192.168.1.7}
      name: "Proxmox 7"
    - host: ${PROXMOX_NODE_2|192.168.1.8}
      name: "Proxmox 8"
    - host: ${PROXMOX_NODE_3|192.168.1.9}
      name: "Proxmox 9"
  user: ${PROXMOX_USER|root@pam}
  api_port: 8006
  verify_ssl: false

truenas:
  servers:
    - host: ${TRUENAS_MAIN_HOST|192.168.1.12}
      name: "Main"
      user: ${TRUENAS_MAIN_USER|admin}
    - host: ${TRUENAS_BACKUP_HOST|192.168.1.108}
      name: "Backup"
      user: ${TRUENAS_BACKUP_USER|admin}
  api_port: 443
  verify_ssl: false
